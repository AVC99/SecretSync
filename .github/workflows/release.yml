# Every push to main (i.e. every merged PR) publishes a new release.
# The version bump comes from the labels of the merged PR:
#   major / minor → bump that part, otherwise patch; no-release → skip.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

      - name: Next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
          echo "PR labels: ${labels:-(none)}"
          if echo "$labels" | grep -qx no-release; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            if echo "$labels" | grep -qx major; then
              next="v$((major + 1)).0.0"
            elif echo "$labels" | grep -qx minor; then
              next="v$major.$((minor + 1)).0"
            else
              next="v$major.$minor.$((patch + 1))"
            fi
          fi
          echo "Release: ${last:-none} -> $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
